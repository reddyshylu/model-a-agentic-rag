name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LLM_BACKEND: none   # offline template answers: no API keys needed, no cost
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-core.txt

      - name: Install dependencies
        run: pip install -r requirements-core.txt

      - name: Run hard-gate tests
        run: python -m pytest -q

      - name: Check the Docker image builds
        run: docker build -t model-a .
